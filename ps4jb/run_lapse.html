<!doctype html>
<html lang="en" manifest="cache.manifest">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#000000">
    <title>PS4 Jailbreak</title>
    <link rel="stylesheet" href="../assets/styles.css">
    <style>
      body { place-items: start center; padding: 1.5rem 0; }
      .stage { gap: 1rem; }
      #device-title { font-size: clamp(2.5rem, 11vw, 5rem); }
      #state { font-size: clamp(1rem, 4vw, 1.4rem); font-weight: 700; }
      #state.ok { color: #fff; } #state.bad { color: #ff7777; } #state.warn { color: #e1bd72; }
      #out { max-height: none; height: 60vh; flex: 1; display: block; }
    </style>
  </head>
  <body>
    <main class="stage">
      <h1 id="device-title">PS4</h1>
      <div id="state">loading lapse chain...</div>
      <pre id="out" aria-live="polite"></pre>
    </main>
    <script>
      (function () {
        var m = /PlayStation\s+4[\/ ](\d+)\.(\d+)/.exec(navigator.userAgent);
        if (m) {
          var min = parseInt(m[2], 16).toString(16).padStart(2, '0').toUpperCase();
          var label = 'PS4 ' + parseInt(m[1], 10) + '.' + min;
          document.getElementById('device-title').textContent = label;
          document.title = label;
        }
      })();
    </script>
    <script type="module">import "./chain_lapse.js";</script>
  </body>
</html>
